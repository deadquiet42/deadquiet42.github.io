<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Geogrowth · deadquiet42</title>
  <meta name="description" content="A geometric art tool exploring pattern, preference and perspective." />
  <link rel="canonical" href="https://deadquiet42.github.io/geogrowth/app/" />
  <meta property="og:title" content="Geogrowth · deadquiet42" />
  <meta property="og:description" content="A geometric art tool exploring pattern, preference and perspective." />
  <meta property="og:url" content="https://deadquiet42.github.io/geogrowth/app/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Geogrowth · deadquiet42" />
  <meta name="twitter:description" content="A geometric art tool exploring pattern, preference and perspective." />
  <meta property="og:image" content="https://deadquiet42.github.io/geogrowth/app/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A monochrome composition of overlapping circles, squares, lines and semicircles generated by Geogrowth." />

  <link rel="icon" href="../../favicon.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Geogrowth <span class="version">v1.9</span></h1>
    <div class="canvas-wrap">
      <canvas id="art" role="img" aria-label="Generated geometric artwork"></canvas>
      <p id="submissionStatus" class="submission-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
    </div>

    <section class="controls">
      <div class="options">
        <button id="generate" aria-label="Generate artwork">Generate</button>
        <button id="download" aria-label="Download artwork as a high quality PNG">Download</button>
      </div>
      <div class="mode-options" role="group" aria-label="Artwork modes">
        <label for="invertToggle">
          <input id="invertToggle" name="invert" type="checkbox" />
          <span>Invert</span>
        </label>
        <label for="toggleColour">
          <input id="toggleColour" name="colour" type="checkbox" />
          <span>Colour</span>
        </label>
        <label for="glitchToggle">
          <input id="glitchToggle" name="glitch" type="checkbox" />
          <span>Glitch</span>
        </label>
      </div>
      <div class="sliders">
        <div class="slider-column">
          <label for="squareCount">Squares</label>
          <input type="range" id="squareCount" min="0" max="10" value="3" />
          <span id="squareVal">3</span>

          <label for="circleCount">Circles</label>
          <input type="range" id="circleCount" min="0" max="10" value="3" />
          <span id="circleVal">3</span>

          <label for="lineCount">Lines</label>
          <input type="range" id="lineCount" min="0" max="10" value="4" />
          <span id="lineVal">4</span>

          <button id="shapeTypeToggle" class="shape-type-toggle" type="button" aria-controls="semicircleCount" aria-label="Shape type: Semicircles. Activate to change shape">Semicircles</button>
          <input type="range" id="semicircleCount" min="0" max="10" value="4" aria-label="Semicircles count" data-shape-type="semicircle" />
          <span id="semicircleVal">4</span>

        </div>

        <div class="slider-column">
          <label for="sizeVariance">Size variation</label>
          <input type="range" id="sizeVariance" min="0" max="100" value="30" />
          <span id="sizeVarVal">30%</span>

          <label for="rotationRange">Rotation</label>
          <input type="range" id="rotationRange" min="0" max="360" value="0" />
          <span id="rotationVal">0°</span>

          <label for="strokeWeight">Stroke thickness</label>
          <input type="range" id="strokeWeight" min="0.1" max="10" value="1" step="0.1" />
          <span id="strokeVal">1 px</span>

          <label for="dotCount">Dots</label>
          <input type="range" id="dotCount" min="0" max="10" value="4" />
          <span id="dotVal">4</span>
        </div>
      </div>
    </section>

    <script type="module" src="script.js"></script>
    <script type="module" src="invert.js"></script>
    <script type="module" src="colour.js"></script>
  </main>
</body>
</html>
